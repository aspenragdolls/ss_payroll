{% extends "base.html" %}
{% block title %}{% if package %}Edit{% else %}New{% endif %} Package — ss_payroll{% endblock %}
{% block content %}
<h1>{% if package %}Edit Package{% else %}New Package{% endif %}</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="card">
  <form method="post">
    <label>Name</label>
    <input type="text" name="name" value="{{ package.name if package else '' }}" required>

    <label>Service type</label>
    <select name="service_type" required>
      {% for key, label in service_types %}
      <option value="{{ key }}" {% if package and package.service_type == key %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>

    <label>Base price ($)</label>
    <input type="text" name="base_price" value="{{ package.base_price if package else '' }}" required>

    <label>Description</label>
    <textarea name="description" rows="3">{{ package.description if package and package.description else '' }}</textarea>

    <div class="checkbox-row">
      <label><input type="checkbox" name="is_active" value="on" {% if not package or package.is_active %}checked{% endif %}> Active</label>
    </div>

    <p style="margin-top:1rem">
      <button class="btn" type="submit">Save</button>
      <a class="btn btn-secondary" href="/packages">Cancel</a>
    </p>
  </form>
</div>
{% endblock %}
