<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}ss_payroll{% endblock %}</title>

  {# Home-screen / Safari web app #}
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SS Payroll">
  <meta name="application-name" content="SS Payroll">
  <meta name="theme-color" content="#0B5C3B">
  <link rel="apple-touch-icon" href="/static/icons/app-icon-180.png?v={{ static_version }}">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/app-icon-192.png?v={{ static_version }}">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/app-icon-512.png?v={{ static_version }}">
  <link rel="manifest" href="/static/manifest.json?v={{ static_version }}">

  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="/static/button-feedback.js?v={{ static_version }}" defer></script>
</head>
<body>
  {% if user %}
  <header>
    <div><strong>{{ user.business_name }}</strong> — ss_payroll</div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/events/new">New Event</a>
      <a href="/workers">Workers</a>
      <a href="/customers">Customers</a>
      <a href="/payroll/begin">Payroll</a>
      <a href="/payroll/history">History</a>
      <a href="/settings/payroll">Pay Setup</a>
      <a href="/settings/calendar">Calendar</a>
      <a href="/settings/accounting">Accounting</a>
      <form action="/auth/logout" method="post" style="display:inline">
        <button type="submit" class="btn btn-secondary" style="margin-left:1rem">Logout</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
